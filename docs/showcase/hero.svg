  <circle cx="160" cy="90" r="220" fill="url(#blobA)"/>
  <circle cx="760" cy="300" r="240" fill="url(#blobB)"/>

  <rect x="0" y="364" width="880" height="36" fill="#0f2b2b" opacity="0.92"/>
  <g opacity="0.85">
