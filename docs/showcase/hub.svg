  <g font-size="12" font-weight="600" text-anchor="middle">
    <text x="105" y="64" fill="#120d0b">Shortcuts<animate attributeName="fill" values="#120d0b;#120d0b;#bba99c;#bba99c;#120d0b" keyTimes="0;0.45;0.47;0.97;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="205" y="64" fill="#bba99c">Clipboard<animate attributeName="fill" values="#bba99c;#bba99c;#120d0b;#120d0b;#bba99c" keyTimes="0;0.46;0.48;0.96;1" dur="10s" repeatCount="indefinite"/></text>
    <text x="283" y="64" fill="#bba99c">Clock</text>
  </g>
  <path d="M422 56l5 5 5-5" fill="none" stroke="#bba99c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

