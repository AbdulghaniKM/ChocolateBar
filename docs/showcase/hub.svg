      <rect x="52" y="154" width="396" height="50" rx="14" fill="#ffecdc" fill-opacity="0.045" stroke="#ffecdc" stroke-opacity="0.07"/><rect x="62" y="162" width="34" height="34" rx="8" fill="#1f1714"/><path d="M73 170h8l5 5v13h-13z" fill="none" stroke="#eaa660" stroke-width="1.6" stroke-linejoin="round"/><text x="108" y="176" font-size="13" font-weight="600" fill="#f8efe6">report.docx</text><text x="108" y="191" font-size="11" fill="#bba99c">C:\Users\you\Documents</text><text x="434" y="170" text-anchor="end" font-size="10" fill="#8a786c">9m</text>
      <rect x="52" y="212" width="396" height="50" rx="14" fill="#ffecdc" fill-opacity="0.045" stroke="#ffecdc" stroke-opacity="0.07"/><text x="66" y="241" font-size="13" fill="#f8efe6">https://github.com/AbdulghaniKM/ChocolateBar</text><text x="434" y="228" text-anchor="end" font-size="10" fill="#8a786c">32m</text>
      <rect x="52" y="270" width="396" height="50" rx="14" fill="#ffecdc" fill-opacity="0.045" stroke="#ffecdc" stroke-opacity="0.07"/><text x="66" y="299" font-size="13" fill="#f8efe6">npm run build &amp;&amp; npm run preview</text><text x="434" y="286" text-anchor="end" font-size="10" fill="#8a786c">1h</text>
    </g>
