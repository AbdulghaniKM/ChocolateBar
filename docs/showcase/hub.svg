    <rect x="52" y="96" width="194" height="100" rx="16" fill="#ffecdc" fill-opacity="0.045" stroke="#ffecdc" stroke-opacity="0.07"/>
    <rect x="52" y="96" width="194" height="100" rx="16" fill="#eaa660" fill-opacity="0" stroke="#eaa660" stroke-opacity="0.6"><animate attributeName="fill-opacity" values="0;0;0.18;0.18;0;0" keyTimes="0;0.09;0.1;0.13;0.16;1" dur="10s" repeatCount="indefinite"/></rect>
