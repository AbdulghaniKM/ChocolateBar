[package]
name = "chocolatebar"
version = "0.2.0"
description = "Dynamic Island bar for Windows"
edition = "2021"

[lib]
name = "chocolatebar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
crossbeam-channel = "0.5"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
rustfft = "6"
cpal = "0.18.2"
wmi = "0.18.4"
notify = "8.2.1"
sysinfo = "0.39.6"
keyvalues-parser = "0.2.4"
base64 = "0.23.1"
dirs = "7.0.0"
getrandom = "0.4.3"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Storage_Streams", "Media", "Media_Control", "Media_Ocr",
  "Globalization", "Graphics_Imaging", "UI_Notifications", "UI_Notifications_Management",
  "Devices_Enumeration", "Devices_Bluetooth", "Devices_Bluetooth_Rfcomm",
  "Devices_Bluetooth_GenericAttributeProfile", "Networking_Sockets", "Networking_Connectivity",
  "System_Power", "Devices_Power", "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_System_Power", "Win32_Storage_Packaging_Appx", "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Globalization",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
